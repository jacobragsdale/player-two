[package]
name = "player-two-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow = "1.0"
player-two-core.workspace = true
player-two-desk.workspace = true
serde_json = "1.0.154"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"

[target.'cfg(windows)'.dependencies]
# Windows' own folder dialog, for sharing a folder, and its message box, for asking before Quit
# stops a run. Not a Tauri plugin, so the webview gets none.
rfd = { version = "0.16", default-features = false }
tauri-winrt-notification = "0.8"

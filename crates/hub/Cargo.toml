[package]
name = "player-two-hub"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
getrandom = "0.4.3"
player-two-core.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-postgres = "0.7.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
tokio-stream = "0.1.19"

[dev-dependencies]
tempfile = "3.27.0"

# The checks every commit is held to, on the platform everyone uses, then a debug installer to try on a work machine.
name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      # First, because the app crate embeds ui/dist.
      - run: npm --prefix ui run check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Run from the root, where the CLI finds crates/app/tauri.conf.json.
      - run: npm --prefix ui exec -- tauri build --debug
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: target/debug/bundle/nsis/*.exe
          if-no-files-found: error

# The checks every commit is held to, on the platform everyone uses. The hashFiles guards keep it green until phase 0 has made each part; task P0-6 removes them and adds the app crate and the installer.
name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        if: hashFiles('ui/package.json') != ''
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: hashFiles('ui/package.json') != ''
        run: npm ci --prefix ui
      - if: hashFiles('ui/package.json') != ''
        run: npm --prefix ui run check
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('Cargo.toml') != ''
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: hashFiles('Cargo.toml') != ''
      - if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all --check
      - if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --exclude player-two-app --all-targets -- -D warnings
      - if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace --exclude player-two-app

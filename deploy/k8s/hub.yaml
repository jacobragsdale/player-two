# The hub: one pod, never two, since only one process may open its database. Apply data.yaml
# first, and make the secret once:
#   kubectl create secret generic player-two \
#     --from-literal=join-token=$(openssl rand -hex 24) \
#     --from-literal=admin-token=$(openssl rand -hex 24)
# Fill in every TODO.
apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: player-two
    spec:
      replicas: 1
      # The old pod lets go of the database before the new one opens it.
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: player-two
      template:
        metadata:
          labels:
            app: player-two
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: hub
              image: TODO-registry/player-two:0.8.0
              ports:
                - containerPort: 8787
              env:
                - name: PLAYER_TWO_URL
                  value: https://TODO-player-two-host
                - name: PLAYER_TWO_JOIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: player-two
                      key: join-token
                - name: PLAYER_TWO_ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: player-two
                      key: admin-token
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: 8787
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backups
                  mountPath: /backups
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: player-two-data
            - name: backups
              persistentVolumeClaim:
                claimName: player-two-backups
  - apiVersion: v1
    kind: Service
    metadata:
      name: player-two
    spec:
      selector:
        app: player-two
      ports:
        - port: 80
          targetPort: 8787
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: player-two
      annotations:
        # Each person's stream stays open for as long as their app runs.
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
    spec:
      ingressClassName: nginx # TODO: your ingress class
      tls:
        - hosts: [TODO-player-two-host]
          secretName: player-two-tls # TODO: your certificate's secret
      rules:
        - host: TODO-player-two-host
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: player-two
                    port:
                      number: 80

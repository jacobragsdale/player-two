# The hub: one pod, never two, since the stream and who is here live in its memory. Make the
# secret once, with the address of the hub's own Postgres database in this cluster:
#   kubectl create secret generic player-two \
#     --from-literal=join-token=$(openssl rand -hex 24) \
#     --from-literal=admin-token=$(openssl rand -hex 24) \
#     --from-literal=database-url=postgres://player_two:PASSWORD@HOST/player_two
# Fill in every TODO.
apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: player-two
    spec:
      replicas: 1
      # The old pod has stopped before the new one starts.
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: player-two
      template:
        metadata:
          labels:
            app: player-two
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: hub
              image: TODO-registry/player-two:0.8.0
              ports:
                - containerPort: 8787
              env:
                - name: PLAYER_TWO_URL
                  value: https://TODO-player-two-host
                - name: PLAYER_TWO_JOIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: player-two
                      key: join-token
                - name: PLAYER_TWO_ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: player-two
                      key: admin-token
                - name: PLAYER_TWO_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: player-two
                      key: database-url
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: 8787
  - apiVersion: v1
    kind: Service
    metadata:
      name: player-two
    spec:
      selector:
        app: player-two
      ports:
        - port: 80
          targetPort: 8787
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: player-two
      annotations:
        # Each person's stream stays open for as long as their app runs.
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
    spec:
      ingressClassName: nginx # TODO: your ingress class
      tls:
        - hosts: [TODO-player-two-host]
          secretName: player-two-tls # TODO: your certificate's secret
      rules:
        - host: TODO-player-two-host
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: player-two
                    port:
                      number: 80

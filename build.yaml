# Azure DevOps release pipeline. It builds the Windows installer, then the hub's image, which carries the installer.
#
# This is a stub. Fill in every TODO with your organisation's names. Task P3-5 replaces the placeholder
# steps with the real commands. The repository is public, so nothing internal belongs in this file:
# keep names and secrets in the variable group and the service connection.
#
# Point the pipeline at this repository through a GitHub service connection, or at an internal mirror of it.

trigger:
  tags:
    include: ["v*"]
pr: none

variables:
  # TODO: a variable group holding TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, both secret.
  - group: TODO-player-two-release
  # TODO: a Docker registry service connection to your registry.
  - name: containerRegistry
    value: TODO-registry-connection
  # TODO: the image's repository in that registry.
  - name: imageRepository
    value: TODO/player-two

stages:
  - stage: installer
    displayName: Windows installer
    jobs:
      - job: build
        pool:
          vmImage: windows-latest # TODO: or your own pool, as `name: TODO`
        steps:
          - checkout: self
          # TODO (P3-5): install Rust stable and Node 26, run `npm ci --prefix ui`, then `cargo tauri build`.
          - script: echo "TODO (P3-5) build the installer"
            displayName: Build the installer
            env:
              TAURI_SIGNING_PRIVATE_KEY: $(TAURI_SIGNING_PRIVATE_KEY)
              TAURI_SIGNING_PRIVATE_KEY_PASSWORD: $(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          # TODO (P3-5): publish player-two-setup.exe and its .sig from target/release/bundle/nsis.
          - script: echo "TODO (P3-5) publish the installer"
            displayName: Publish the installer

  - stage: image
    displayName: Hub image
    dependsOn: installer
    jobs:
      - job: build
        pool:
          vmImage: ubuntu-latest # TODO: or your own pool, as `name: TODO`
        steps:
          - checkout: self
          # TODO (P3-5): download the installer artifact into deploy/release/.
          - script: echo "TODO (P3-5) fetch the installer into deploy/release"
            displayName: Fetch the installer
          - task: Docker@2
            displayName: Build and push the image
            inputs:
              command: buildAndPush
              containerRegistry: $(containerRegistry)
              repository: $(imageRepository)
              Dockerfile: deploy/Dockerfile
              buildContext: .
              tags: $(Build.SourceBranchName)

  # TODO: a deploy stage, if you want one, along the lines of
